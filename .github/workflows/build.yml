name: Build executables

# 推送/打标签时自动打包 Windows exe 与 Linux 可执行文件
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Generate icon
        run: python make_icon.py

      - name: Build executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m PyInstaller --noconfirm --clean --onefile --windowed --icon app.ico --add-data "md_icon_64.ppm;." --name MDWorkflowManager main.py
          else
            python -m PyInstaller --noconfirm --clean --onefile --add-data "md_icon_64.ppm:." --name MDWorkflowManager main.py
          fi

      - name: Self-test packaged binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/MDWorkflowManager.exe --selftest || true
          else
            ./dist/MDWorkflowManager --selftest || true
          fi
          cat mdwf_selftest_report.txt || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDWorkflowManager-${{ matrix.os }}
          path: |
            dist/MDWorkflowManager
            dist/MDWorkflowManager.exe
          if-no-files-found: error

  # 在 Rocky Linux 9.2 容器内构建，保证产物在 Rocky 9.2（glibc 2.34）上可运行
  build-rocky92:
    runs-on: ubuntu-latest
    container: rockylinux:9.2
    steps:
      - name: Install git (checkout 需要)
        run: dnf -y install git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf -y install python3 python3-pip python3-tkinter gcc make

      - name: Install PyInstaller
        run: python3 -m pip install pyinstaller

      - name: Generate icon
        run: python3 make_icon.py

      - name: Build executable
        run: >
          python3 -m PyInstaller --noconfirm --clean --onefile
          --add-data "md_icon_64.ppm:." --name MDWorkflowManager main.py

      - name: Self-test packaged binary
        run: |
          ./dist/MDWorkflowManager --selftest || true
          cat mdwf_selftest_report.txt || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDWorkflowManager-rocky92
          path: dist/MDWorkflowManager
          if-no-files-found: error
